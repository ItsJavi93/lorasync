[radio]
port = "COM3"              # Windows: COM*, Linux: /dev/ttyUSB*
addr = 10                  # dirección propia (0-65535)
channel = 70                # 850 + canal = MHz; 65-78 = banda legal CO (920 MHz en canal 70)
sf = 7                       # factor de dispersión
bw_code = 2                  # 0=125k, 1=250k, 2=500k
cr = 1                        # tasa de codificación 4/5
power_dbm = 10
netid = 0
lbt = true                    # true en modo ALOHA, false en modo TDMA (retrasa TX hasta 2 s)
rssi_append = true           # añade byte de RSSI al final de cada paquete recibido
allow_out_of_band = false    # solo para pruebas de laboratorio fuera de la banda legal

[node]                       # solo lo usa node/main.py
master_addr = 10             # addr del dongle del maestro
db_path = "node.db"

[master]                     # solo lo usa master/main.py
db_path = "master.db"
csv_dir = "csv"
