[radio]
port = "COM3"              # Windows: COM*; Pi: ruta de /dev/serial/by-id/ (el dongle es ttyACM*)
addr = 10                  # dirección propia (0-65535)
channel = 70                # 850 + canal = MHz; 65-78 = banda legal CO (920 MHz en canal 70)
sf = 7                       # factor de dispersión
bw_code = 2                  # 0=125k, 1=250k, 2=500k
cr = 1                        # tasa de codificación 4/5
power_dbm = 10
netid = 0
lbt = true                    # true en modo ALOHA, false en modo TDMA (retrasa TX hasta 2 s)
rssi_append = true           # el módulo añade 2 bytes de RSSI al final de cada paquete recibido
allow_out_of_band = false    # solo para pruebas de laboratorio fuera de la banda legal

[node]                       # solo lo usa node/main.py
master_addr = 10             # addr del dongle del maestro
db_path = "node.db"

# Ritmo del nodo. El aire NO es el cuello de botella: un lote de 10 muestras ocupa ~80 ms con
# SF7/BW500/CR4-5, o sea menos del 3 % de un ciclo típico. El resto son esperas de software y
# de LBT, y es ahí donde se ajusta la velocidad.
sample_interval_s = 1.0      # cada cuánto se toma una muestra: gobierna la tasa de datos real
batch_size = 10              # muestras por trama (10 -> ~200 B, holgado bajo el límite del módulo)
ack_timeout_s = 3.0          # debe cubrir el LBT del maestro (hasta 2 s), no solo el aire.
                             # Si se queda corto, el ACK llega tarde, se lee en el ciclo
                             # siguiente y la cola se clava un lote por detrás para siempre.
aloha_max_delay_s = 2.0      # jitter antievitación de colisiones ANTES de cada TX. Con un solo
                             # nodo no evita nada y cuesta ~1 s de media por envío: bájalo a 0.2
                             # en pruebas de un nodo, súbelo al desplegar varios.
flush_interval_s = 10.0      # envía un lote incompleto si pasa este tiempo sin llenar batch_size

[master]                     # solo lo usa master/main.py
db_path = "master.db"
csv_dir = "csv"
